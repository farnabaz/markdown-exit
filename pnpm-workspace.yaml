ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - docs
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@typescript/native': npm:typescript@^7.0.2
  bumpp: ^12.3.0
  eslint: ^10.13.0
  tsdown: ^0.23.3
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: ^8.3.5

catalogs:
  bench:
    '@types/commonmark': ^0.27.10
    '@types/markdown-it': ^14.2.0
    commonmark: ^0.31.2
    markdown-it: ^15.0.3
    marked: ^18.1.2
  docs:
    typedoc: ^0.28.20
    typedoc-plugin-frontmatter: ^1.3.3
    typedoc-plugin-markdown: ^4.14.1
    typedoc-vitepress-theme: ^1.1.4
    vitepress: 2.0.0-alpha.12
    vue: ^3.5.44
  integrations:
    entities: ^9.0.0
    linkify-it: ^6.1.0
    mdurl: ^2.1.0
    punycode.js: ^2.3.1
    uc.micro: ^3.0.0
  tests:
    '@codspeed/vitest-plugin': ^6.1.0
    js-yaml: ^5.5.0
    shiki: ^4.5.0
    tinyglobby: ^0.2.17
    vitest: ^5.0.5
  types:
    '@types/js-yaml': ^4.0.9
    '@types/mdurl': ^2.0.0
    '@types/node': ^26.6.6
